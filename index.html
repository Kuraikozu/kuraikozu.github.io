<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet", href="style.css">
<title>Kiri's Website</title>
<style>

</style>
</head>
<body>

<!-- 🌙 / ☀️ Theme Toggle -->
 <div class="theme-toggle">
    <input type="checkbox" id="theme-switch" />
    <label for="theme-switch" class="switch">
        <span class="icon moon">🌙</span>
        <span class="icon sun">☀️</span>
    </label>
 </div>

<!-- SMALL PROFILE CARD -->
<div class="profile-card">
    <div class="banner"></div>
    <img class="avatar" src="testing.png" />

    <div class="profile-info">
        <div class="username">Kiri</div>
        <div class="tagline">Kuraiko(zu) • Love you</div>
    </div>

    <div class="badge-container">

        <div class="badge" data-type="small" data-tooltip="Test">
            <img src="icons/testing.png">
        </div>
    </div>

    <div id="tooltip"></div>

    <div class="section">
        <b>About Me</b><br>
        I LOVE BUNNIES ^•ﻌ•^
    </div>

    <div class="section">
        <b>Mutual Servers — 6</b>
    </div>

    <div class="view-full" id="openFull">View Full Profile</div>
</div>

<!-- FULL PROFILE MODAL -->
<div class="modal-bg" id="modalBg">
    <div class="full-modal">
        <div class="close-btn" id="closeModal">✖</div>

        <!-- LEFT SIDE PROFILE (small info) -->
        <div class="left-panel">
            <div class="banner"></div>
            <img class="avatar" src="avatar.png" style="left: 15px; top:-35px;" />

            <div style="padding: 15px;">
                <h2>In Work</h2>
                <p>Hey! This is my profile c:</p>
                <p><b>Member Since:</b> ???</p>
            </div>
        </div>

        <!-- RIGHT SIDE EXTENDED INFO -->
        <div class="right-panel">
            <h2>Games I like</h2>
            <p>Minecraft, Stardew Valley, Terraria, Subnautica ...</p>

            <h2>Favorite Game</h2>
            <p>Minecraft</p>

            <h2>Games in Rotation</h2>
            <p>Meow</p>
        </div>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
